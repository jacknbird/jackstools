<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Editor — Jacks Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{font-family:'DM Sans',sans-serif;background:#e8f4f8;color:#1a3a4a}
.app{display:flex;flex-direction:column;height:100vh}
.toolbar{display:flex;align-items:center;gap:6px;padding:8px 12px;border-bottom:0.5px solid #b0d4e3;background:#f0faff;flex-shrink:0;flex-wrap:wrap}
.logo{font-size:13px;font-weight:500;color:#2a7fa5;margin-right:4px;text-decoration:none;display:flex;align-items:center;gap:6px}
.project-name{font-size:13px;font-weight:500;color:#1a3a4a;max-width:200px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sep{width:0.5px;height:18px;background:#b0d4e3;margin:0 2px}
.btn{font-size:12px;padding:5px 11px;border-radius:5px;border:0.5px solid #b0d4e3;background:#e8f4f8;color:#3a7a9a;cursor:pointer;display:flex;align-items:center;gap:5px;white-space:nowrap;font-family:'DM Sans',sans-serif;transition:background .1s,color .1s}
.btn:hover{background:#dff0f8;color:#1a3a4a;border-color:#7abcd4}
.btn.active{background:#cce8f4;border-color:#2a7fa5;color:#1a5a7a}
.btn-save{background:#2a7fa5;color:#fff;border-color:#2a7fa5}
.btn-save:hover{background:#1a6a8a;color:#fff}
.btn-home{color:#5a9ab5}
.btn-home:hover{color:#1a3a4a}
.main{display:flex;flex:1;overflow:hidden}
.editor-pane{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;position:relative}
.preview-bar{background:#e0f2fa;border-bottom:0.5px solid #7abcd4;padding:8px 16px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.preview-label{font-size:12px;color:#1a6a8a;display:flex;align-items:center;gap:6px}
.preview-actions{display:flex;gap:6px}
.editor{flex:1;width:100%;resize:none;border:none;outline:none;padding:20px 24px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.8;background:#f7fcff;color:#1a3a4a;overflow-y:auto;caret-color:#2a7fa5}
.editor::selection{background:#b8dff0}
.editor::placeholder{color:#9acad8}
.editor.preview-mode{background:#eef8fd;color:#5a8a9a;cursor:default}
.diff-view{flex:1;padding:20px 24px;font-family:'JetBrains Mono',monospace;font-size:13px;line-height:1.8;overflow-y:auto;white-space:pre-wrap;word-break:break-word;color:#1a3a4a;background:#f7fcff}
.diff-add{background:#c8f0d8;color:#1a4a2a;border-radius:2px}
.diff-remove{background:#fadadd;color:#6a1a1a;text-decoration:line-through;border-radius:2px}
.find-bar{border-top:0.5px solid #b0d4e3;padding:8px 12px;background:#f0faff;display:flex;flex-direction:column;gap:6px;flex-shrink:0}
.find-row{display:flex;gap:6px;align-items:center}
.find-input{flex:1;font-size:12px;padding:5px 9px;border-radius:5px;border:0.5px solid #b0d4e3;background:#e8f4f8;color:#1a3a4a;font-family:'DM Sans',sans-serif}
.find-input:focus{outline:none;border-color:#2a7fa5}
.find-info{font-size:11px;color:#7aaab8;min-width:60px;text-align:right}
.sidebar{width:220px;border-left:0.5px solid #b0d4e3;display:flex;flex-direction:column;overflow:hidden;flex-shrink:0;background:#f0faff}
.sidebar-tabs{display:flex;border-bottom:0.5px solid #b0d4e3;flex-shrink:0}
.tab{flex:1;padding:8px 4px;font-size:11px;text-align:center;cursor:pointer;color:#7aaab8;border-bottom:1.5px solid transparent;background:none;border-top:none;border-left:none;border-right:none;font-family:'DM Sans',sans-serif;transition:color .1s}
.tab.active{color:#1a3a4a;border-bottom-color:#2a7fa5}
.sidebar-content{flex:1;overflow-y:auto;padding:10px}
.v-section-label{font-size:10px;text-transform:uppercase;letter-spacing:.08em;color:#9acad8;margin:10px 0 6px;padding:0 2px}
.version-item{padding:9px 10px;border-radius:6px;border:0.5px solid #c8e8f4;margin-bottom:6px;background:#e8f4f8;transition:border-color .1s}
.version-item.current-version{border-color:#7abcd4;background:#dff0f8}
.version-item.previewing{border-color:#2a7fa5;background:#cce8f4}
.version-item:not(.current-version):hover{border-color:#7abcd4;cursor:pointer}
.version-top{display:flex;align-items:flex-start;justify-content:space-between;gap:4px}
.version-note{font-size:12px;font-weight:500;color:#1a3a4a;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.current-badge{font-size:9px;padding:2px 6px;border-radius:10px;background:#b0d4e3;color:#1a5a7a;white-space:nowrap;flex-shrink:0}
.preview-badge{font-size:9px;padding:2px 6px;border-radius:10px;background:#cce8f4;color:#1a5a7a;white-space:nowrap;flex-shrink:0}
.version-meta{font-size:10px;color:#7aaab8;margin-top:2px}
.version-actions{display:flex;gap:4px;margin-top:7px;flex-wrap:wrap}
.vbtn{font-size:10px;padding:3px 8px;border-radius:4px;border:0.5px solid #b0d4e3;background:transparent;color:#5a9ab5;cursor:pointer;font-family:'DM Sans',sans-serif;transition:color .1s,background .1s}
.vbtn:hover{background:#dff0f8;color:#1a3a4a}
.vbtn.make-current{color:#2a7fa5;border-color:#7abcd4}
.vbtn.make-current:hover{background:#cce8f4;color:#1a5a7a}
.vbtn.diff-btn:hover{color:#2a7fa5}
.vbtn.del-btn:hover{color:#d04040}
.empty-state{font-size:12px;color:#9acad8;text-align:center;padding:20px 8px;line-height:1.7}
.statusbar{display:flex;align-items:center;gap:16px;padding:5px 14px;border-top:0.5px solid #b0d4e3;background:#f0faff;flex-shrink:0;font-size:11px;color:#7aaab8}
.statusbar span{display:flex;align-items:center;gap:4px}
.modal-overlay{position:fixed;inset:0;background:rgba(30,80,110,.2);display:flex;align-items:center;justify-content:center;z-index:100}
.modal{background:#f0faff;border:0.5px solid #b0d4e3;border-radius:10px;padding:20px;width:290px;box-shadow:0 8px 40px rgba(30,80,110,.12)}
.modal h3{font-size:14px;font-weight:500;margin-bottom:12px;color:#1a3a4a}
.modal p{font-size:12px;color:#5a8a9a;margin-bottom:14px;line-height:1.6}
.modal input{width:100%;font-size:13px;padding:8px 10px;border-radius:6px;border:0.5px solid #b0d4e3;background:#e8f4f8;color:#1a3a4a;margin-bottom:12px;font-family:'DM Sans',sans-serif}
.modal input:focus{outline:none;border-color:#2a7fa5}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
.stat-card{background:#e8f4f8;border-radius:6px;padding:12px;margin-bottom:8px;border:0.5px solid #c8e8f4}
.stat-label{font-size:10px;color:#7aaab8;text-transform:uppercase;letter-spacing:.06em;margin-bottom:4px}
.stat-val{font-size:26px;font-weight:500;color:#1a3a4a}
</style>
</head>
<body>
<div class="app">
  <div class="toolbar">
    <a href="prompts.html" class="btn btn-home"><i class="ti ti-arrow-left"></i> Projects</a>
    <span class="sep"></span>
    <span class="project-name" id="project-name">Loading…</span>
    <span class="sep"></span>
    <button class="btn btn-save" id="btn-save-ver" onclick="openSaveModal()"><i class="ti ti-device-floppy"></i> Save version</button>
    <button class="btn" id="btn-find" onclick="toggleFind()"><i class="ti ti-search"></i> Find</button>
    <button class="btn" id="btn-diff" onclick="toggleDiff()"><i class="ti ti-git-diff"></i> Diff</button>
    <button class="btn" onclick="copyPrompt()"><i class="ti ti-copy"></i> Copy</button>
    <span id="copy-confirm" style="font-size:11px;color:#2a9a5a;display:none">Copied!</span>
    <span id="diff-label" style="display:none;font-size:11px;color:#2a7fa5;margin-left:4px"><i class="ti ti-git-diff"></i> Diff mode</span>
  </div>
  <div class="main">
    <div class="editor-pane">
      <div class="preview-bar" id="preview-bar" style="display:none">
        <span class="preview-label"><i class="ti ti-eye"></i> Previewing: <b id="preview-name"></b></span>
        <div class="preview-actions">
          <button class="btn btn-save" onclick="makePreviewCurrent()"><i class="ti ti-check"></i> Make current</button>
          <button class="btn" onclick="closePreview()"><i class="ti ti-x"></i> Back to current</button>
        </div>
      </div>
      <textarea class="editor" id="editor" spellcheck="true" placeholder="Paste or type your prompt here…" oninput="onEdit()"></textarea>
      <div class="diff-view" id="diff-view" style="display:none"></div>
      <div class="find-bar" id="find-bar" style="display:none">
        <div class="find-row">
          <input class="find-input" id="find-input" placeholder="Find…" oninput="doFind()" onkeydown="findKey(event)">
          <span class="find-info" id="find-info"></span>
          <button class="btn" onclick="findNav(-1)"><i class="ti ti-chevron-up"></i></button>
          <button class="btn" onclick="findNav(1)"><i class="ti ti-chevron-down"></i></button>
        </div>
        <div class="find-row">
          <input class="find-input" id="replace-input" placeholder="Replace with…" onkeydown="replaceKey(event)">
          <button class="btn" onclick="replaceOne()">Replace</button>
          <button class="btn" onclick="replaceAll()">All</button>
        </div>
      </div>
    </div>
    <div class="sidebar">
      <div class="sidebar-tabs">
        <button class="tab active" id="tab-versions" onclick="switchTab('versions')">Versions</button>
        <button class="tab" id="tab-stats" onclick="switchTab('stats')">Stats</button>
      </div>
      <div class="sidebar-content" id="sidebar-versions">
        <div class="empty-state" id="versions-empty">Save a version to start tracking changes.</div>
        <div id="versions-list"></div>
      </div>
      <div class="sidebar-content" id="sidebar-stats" style="display:none">
        <div class="stat-card"><div class="stat-label">Words</div><div class="stat-val" id="stat-words">0</div></div>
        <div class="stat-card"><div class="stat-label">Characters</div><div class="stat-val" id="stat-chars">0</div></div>
        <div class="stat-card"><div class="stat-label">Lines</div><div class="stat-val" id="stat-lines">0</div></div>
        <div class="stat-card"><div class="stat-label">Sentences</div><div class="stat-val" id="stat-sentences">0</div></div>
      </div>
    </div>
  </div>
  <div class="statusbar">
    <span><i class="ti ti-text-wrap"></i> <b id="sb-w">0</b>&nbsp;words</span>
    <span><i class="ti ti-letter-case"></i> <b id="sb-c">0</b>&nbsp;chars</span>
    <span><i class="ti ti-list"></i> <b id="sb-l">0</b>&nbsp;lines</span>
  </div>
</div>

<div class="modal-overlay" id="save-modal" style="display:none" onclick="if(event.target===this)closeSaveModal()">
  <div class="modal">
    <h3>Save version</h3>
    <input id="version-note" placeholder="e.g. 'Added tone guidelines'" onkeydown="if(event.key==='Enter')saveVersion()">
    <div class="modal-btns">
      <button class="btn" onclick="closeSaveModal()">Cancel</button>
      <button class="btn btn-save" onclick="saveVersion()">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="confirm-modal" style="display:none" onclick="if(event.target===this)document.getElementById('confirm-modal').style.display='none'">
  <div class="modal">
    <h3>Make this version current?</h3>
    <p>Your current draft will be replaced. This cannot be undone.</p>
    <div class="modal-btns">
      <button class="btn" onclick="document.getElementById('confirm-modal').style.display='none'">Cancel</button>
      <button class="btn btn-save" onclick="confirmMakeCurrent()">Yes, make current</button>
    </div>
  </div>
</div>

<script>
if(sessionStorage.getItem('jt_unlocked')!=='1')window.location.href='index.html';

// get project id from URL
const params=new URLSearchParams(window.location.search);
const PROJECT_ID=params.get('project');
if(!PROJECT_ID)window.location.href='index.html';

const STORAGE_KEY='jt_versions_'+PROJECT_ID;
const DRAFT_KEY='jt_draft_'+PROJECT_ID;
const PROJECTS_KEY='jt_projects';

// set project name in toolbar
try{
  const projects=JSON.parse(localStorage.getItem(PROJECTS_KEY)||'[]');
  const p=projects.find(x=>x.id===PROJECT_ID);
  document.getElementById('project-name').textContent=p?p.name:'Untitled';
  document.title=(p?p.name:'Prompt')+' — Jacks Tools';
}catch(e){}

let versions=[];
let currentDiffId=null;
let showDiff=false;
let showFind=false;
let findMatches=[];
let findIdx=0;
let previewingId=null;

const editor=document.getElementById('editor');

function loadFromStorage(){
  try{
    const saved=localStorage.getItem(STORAGE_KEY);
    if(saved)versions=JSON.parse(saved).map(v=>({...v,ts:new Date(v.ts)}));
    const draft=localStorage.getItem(DRAFT_KEY);
    if(draft)editor.value=draft;
  }catch(e){}
}

function saveToStorage(){try{localStorage.setItem(STORAGE_KEY,JSON.stringify(versions));}catch(e){}}

function saveDraft(){
  if(previewingId!==null)return;
  try{
    localStorage.setItem(DRAFT_KEY,editor.value);
    // update project updatedAt
    const projects=JSON.parse(localStorage.getItem(PROJECTS_KEY)||'[]');
    const p=projects.find(x=>x.id===PROJECT_ID);
    if(p){p.updatedAt=Date.now();localStorage.setItem(PROJECTS_KEY,JSON.stringify(projects));}
  }catch(e){}
}

loadFromStorage();updateStatus();renderVersions();

function onEdit(){if(previewingId!==null)return;updateStatus();saveDraft();if(showDiff&&currentDiffId!==null)renderDiff();if(showFind)doFind();}

function previewVersion(id){
  const v=versions.find(x=>x.id===id);if(!v)return;
  previewingId=id;editor.value=v.text;editor.readOnly=true;editor.classList.add('preview-mode');
  document.getElementById('preview-bar').style.display='flex';
  document.getElementById('preview-name').textContent=v.note;
  document.getElementById('btn-save-ver').style.opacity='0.3';
  document.getElementById('btn-save-ver').style.pointerEvents='none';
  updateStatus();renderVersions();
}

function closePreview(){
  previewingId=null;editor.readOnly=false;editor.classList.remove('preview-mode');
  document.getElementById('preview-bar').style.display='none';
  document.getElementById('btn-save-ver').style.opacity='';
  document.getElementById('btn-save-ver').style.pointerEvents='';
  editor.value=localStorage.getItem(DRAFT_KEY)||'';
  updateStatus();renderVersions();
}

function makePreviewCurrent(){document.getElementById('confirm-modal').style.display='flex';}

function confirmMakeCurrent(){
  document.getElementById('confirm-modal').style.display='none';
  const v=versions.find(x=>x.id===previewingId);if(!v)return;
  const text=v.text;previewingId=null;editor.readOnly=false;editor.classList.remove('preview-mode');
  document.getElementById('preview-bar').style.display='none';
  document.getElementById('btn-save-ver').style.opacity='';
  document.getElementById('btn-save-ver').style.pointerEvents='';
  editor.value=text;saveDraft();updateStatus();renderVersions();
}

function updateStatus(){
  const t=editor.value;
  const words=t.trim()?t.trim().split(/\s+/).length:0;
  const chars=t.length;const lines=t?t.split('\n').length:0;
  const sentences=t.trim()?(t.match(/[.!?]+/g)||[]).length:0;
  document.getElementById('sb-w').textContent=words;document.getElementById('sb-c').textContent=chars;
  document.getElementById('sb-l').textContent=lines;document.getElementById('stat-words').textContent=words;
  document.getElementById('stat-chars').textContent=chars;document.getElementById('stat-lines').textContent=lines;
  document.getElementById('stat-sentences').textContent=sentences;
}

function switchTab(t){
  document.getElementById('sidebar-versions').style.display=t==='versions'?'':'none';
  document.getElementById('sidebar-stats').style.display=t==='stats'?'':'none';
  document.getElementById('tab-versions').classList.toggle('active',t==='versions');
  document.getElementById('tab-stats').classList.toggle('active',t==='stats');
}

function openSaveModal(){if(previewingId!==null)return;document.getElementById('save-modal').style.display='flex';setTimeout(()=>document.getElementById('version-note').focus(),50);}
function closeSaveModal(){document.getElementById('save-modal').style.display='none';document.getElementById('version-note').value='';}

function saveVersion(){
  const note=document.getElementById('version-note').value.trim()||'Untitled version';
  versions.push({id:Date.now(),text:editor.value,note,ts:new Date()});
  saveToStorage();closeSaveModal();renderVersions();
}

function renderVersions(){
  const list=document.getElementById('versions-list');
  const empty=document.getElementById('versions-empty');
  if(!versions.length){empty.style.display='';list.innerHTML='';return;}
  empty.style.display='none';
  const sorted=[...versions].reverse();
  const latest=sorted[0];const older=sorted.slice(1);
  let html=`<div class="v-section-label">Current version</div>${renderVersionItem(latest,true)}`;
  if(older.length){html+=`<div class="v-section-label" style="margin-top:14px">Previous versions</div>`;older.forEach(v=>{html+=renderVersionItem(v,false);});}
  list.innerHTML=html;
}

function renderVersionItem(v,isCurrent){
  const isPreviewing=previewingId===v.id;
  const time=v.ts.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'});
  const date=v.ts.toLocaleDateString([],{month:'short',day:'numeric'});
  let cls='version-item';
  if(isCurrent)cls+=' current-version';
  if(isPreviewing)cls+=' previewing';
  let badge=isCurrent?`<span class="current-badge">current</span>`:'';
  if(isPreviewing)badge=`<span class="preview-badge">previewing</span>`;
  let actions='';
  if(!isCurrent){
    if(isPreviewing){actions=`<button class="vbtn make-current" onclick="makePreviewCurrent()"><i class="ti ti-check"></i> Make current</button><button class="vbtn" onclick="closePreview()"><i class="ti ti-x"></i> Close</button>`;}
    else{actions=`<button class="vbtn" onclick="previewVersion(${v.id})"><i class="ti ti-eye"></i> Preview</button><button class="vbtn diff-btn" onclick="compareTo(${v.id})"><i class="ti ti-git-diff"></i> Diff</button><button class="vbtn del-btn" onclick="deleteVersion(${v.id})"><i class="ti ti-trash"></i> 🗑</button>`;}
  } else {
    actions=`<button class="vbtn diff-btn" onclick="compareTo(${v.id})"><i class="ti ti-git-diff"></i> Diff</button><button class="vbtn del-btn" onclick="deleteVersion(${v.id})"><i class="ti ti-trash"></i> 🗑</button>`;
  }
  return`<div class="${cls}" id="vi-${v.id}"><div class="version-top"><span class="version-note">${esc(v.note)}</span>${badge}</div><div class="version-meta">${date} ${time} &middot; ${v.text.trim().split(/\s+/).length}w</div><div class="version-actions">${actions}</div></div>`;
}

function deleteVersion(id){
  versions=versions.filter(x=>x.id!==id);
  if(previewingId===id)closePreview();
  if(currentDiffId===id){currentDiffId=null;if(showDiff)renderDiff();}
  saveToStorage();renderVersions();
}

function compareTo(id){currentDiffId=id;renderVersions();if(!showDiff){showDiff=true;updateDiffUI();}renderDiff();}
function toggleDiff(){showDiff=!showDiff;updateDiffUI();if(showDiff)renderDiff();}

function updateDiffUI(){
  document.getElementById('btn-diff').classList.toggle('active',showDiff);
  document.getElementById('diff-label').style.display=showDiff?'':'none';
  editor.style.display=showDiff?'none':'';
  document.getElementById('diff-view').style.display=showDiff?'':'none';
}

function renderDiff(){
  const dv=document.getElementById('diff-view');if(!showDiff)return;
  if(currentDiffId===null){dv.innerHTML='<span style="color:#9acad8;font-size:12px">Select a version to compare.</span>';return;}
  const v=versions.find(x=>x.id===currentDiffId);if(!v){dv.textContent='';return;}
  const current=localStorage.getItem(DRAFT_KEY)||'';
  const chunks=computeDiff(v.text,current);
  dv.innerHTML=chunks.map(c=>{
    if(c.type==='same')return esc(c.text);
    if(c.type==='add')return`<span class="diff-add">${esc(c.text)}</span>`;
    return`<span class="diff-remove">${esc(c.text)}</span>`;
  }).join('');
}

function tokenize(t){return t.split(/(\s+)/g).filter(x=>x.length>0);}

function computeDiff(oldText,newText){
  const a=tokenize(oldText),b=tokenize(newText);const m=a.length,n=b.length;
  if(m*n>400000)return[{type:'remove',text:oldText},{type:'add',text:newText}];
  const dp=Array.from({length:m+1},()=>new Int32Array(n+1));
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=a[i-1]===b[j-1]?dp[i-1][j-1]+1:Math.max(dp[i-1][j],dp[i][j-1]);
  const res=[];let i=m,j=n;
  while(i>0||j>0){
    if(i>0&&j>0&&a[i-1]===b[j-1]){res.unshift({type:'same',text:a[i-1]});i--;j--;}
    else if(j>0&&(i===0||dp[i][j-1]>=dp[i-1][j])){res.unshift({type:'add',text:b[j-1]});j--;}
    else{res.unshift({type:'remove',text:a[i-1]});i--;}
  }
  return res;
}

function toggleFind(){
  showFind=!showFind;
  document.getElementById('find-bar').style.display=showFind?'':'none';
  document.getElementById('btn-find').classList.toggle('active',showFind);
  if(showFind){setTimeout(()=>document.getElementById('find-input').focus(),50);doFind();}
  else{findMatches=[];document.getElementById('find-info').textContent='';}
}

function doFind(){
  const q=document.getElementById('find-input').value;
  if(!q){findMatches=[];document.getElementById('find-info').textContent='';return;}
  const text=editor.value,lower=text.toLowerCase(),ql=q.toLowerCase();
  findMatches=[];let pos=0;
  while((pos=lower.indexOf(ql,pos))!==-1){findMatches.push(pos);pos+=ql.length;}
  if(findIdx>=findMatches.length)findIdx=0;
  document.getElementById('find-info').textContent=findMatches.length?`${findIdx+1}/${findMatches.length}`:'0 results';
  if(findMatches.length)highlightFind();
}

function highlightFind(){
  const match=findMatches[findIdx];if(match===undefined)return;
  const q=document.getElementById('find-input').value;
  editor.focus();editor.setSelectionRange(match,match+q.length);
  const lh=parseInt(getComputedStyle(editor).lineHeight)||22;
  const lines=editor.value.substr(0,match).split('\n').length-1;
  editor.scrollTop=Math.max(0,lines*lh-editor.clientHeight/2);
}

function findNav(dir){
  if(!findMatches.length)return;
  findIdx=(findIdx+dir+findMatches.length)%findMatches.length;
  document.getElementById('find-info').textContent=`${findIdx+1}/${findMatches.length}`;
  highlightFind();
}

function findKey(e){if(e.key==='Enter'){e.shiftKey?findNav(-1):findNav(1);}if(e.key==='Escape')toggleFind();}
function replaceKey(e){if(e.key==='Enter')replaceOne();}

function replaceOne(){
  if(previewingId!==null)return;
  const q=document.getElementById('find-input').value,r=document.getElementById('replace-input').value;
  if(!q||!findMatches.length)return;
  const match=findMatches[findIdx];
  editor.value=editor.value.slice(0,match)+r+editor.value.slice(match+q.length);
  onEdit();
}

function replaceAll(){
  if(previewingId!==null)return;
  const q=document.getElementById('find-input').value,r=document.getElementById('replace-input').value;
  if(!q)return;
  editor.value=editor.value.replace(new RegExp(q.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'),'gi'),r);
  onEdit();
}

function copyPrompt(){
  navigator.clipboard.writeText(editor.value).then(()=>{
    const c=document.getElementById('copy-confirm');c.style.display='';
    setTimeout(()=>c.style.display='none',1500);
  });
}

function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prompt Editor — Jacks Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.10.0/tabler-icons.min.css">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{min-height:100%;background:#e8f4f8;color:#1a3a4a;font-family:'DM Sans',sans-serif}
.topbar{display:flex;align-items:center;justify-content:space-between;padding:12px 32px;border-bottom:0.5px solid #b0d4e3;background:#f0faff}
.topbar-left{display:flex;align-items:center;gap:12px}
.back-btn{font-size:12px;padding:5px 11px;border-radius:5px;border:0.5px solid #b0d4e3;background:#e8f4f8;color:#3a7a9a;cursor:pointer;display:flex;align-items:center;gap:5px;text-decoration:none;transition:background .1s}
.back-btn:hover{background:#dff0f8;color:#1a3a4a}
.topbar-title{font-family:'DM Serif Display',serif;font-size:20px;color:#1a3a4a}
.topbar-title span{color:#2a7fa5}
.btn{font-size:12px;padding:7px 14px;border-radius:6px;border:0.5px solid #b0d4e3;background:#e8f4f8;color:#3a7a9a;cursor:pointer;display:inline-flex;align-items:center;gap:5px;font-family:'DM Sans',sans-serif;transition:background .1s}
.btn:hover{background:#dff0f8;color:#1a3a4a;border-color:#7abcd4}
.btn-primary{background:#2a7fa5;color:#fff;border-color:#2a7fa5}
.btn-primary:hover{background:#1a6a8a;color:#fff}
.page{padding:36px 32px;max-width:1000px;margin:0 auto;width:100%}
.page-header{display:flex;align-items:flex-end;justify-content:space-between;margin-bottom:28px}
.page-title{font-size:22px;font-weight:500;color:#1a3a4a}
.page-sub{font-size:12px;color:#7aaab8;margin-top:3px}
.projects-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.project-card{background:#f0faff;border:0.5px solid #c8e8f4;border-radius:10px;padding:20px;cursor:pointer;transition:border-color .15s,box-shadow .15s;position:relative}
.project-card:hover{border-color:#7abcd4;box-shadow:0 4px 16px rgba(42,127,165,.08)}
.card-icon{font-size:22px;margin-bottom:12px;color:#5a9ab5}
.card-name{font-size:14px;font-weight:500;color:#1a3a4a;margin-bottom:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding-right:20px}
.card-meta{font-size:11px;color:#9acad8;line-height:1.6}
.card-menu{position:absolute;top:10px;right:10px;opacity:0;transition:opacity .15s}
.project-card:hover .card-menu{opacity:1}
.card-menu-btn{background:none;border:none;cursor:pointer;color:#7aaab8;padding:4px;border-radius:4px;font-size:15px;line-height:1}
.card-menu-btn:hover{color:#1a3a4a;background:#dff0f8}
.dropdown{position:absolute;top:32px;right:0;background:#f0faff;border:0.5px solid #b0d4e3;border-radius:8px;box-shadow:0 8px 24px rgba(30,80,110,.12);z-index:50;min-width:130px;overflow:hidden}
.dropdown-item{display:flex;align-items:center;gap:8px;padding:9px 14px;font-size:12px;color:#3a7a9a;cursor:pointer}
.dropdown-item:hover{background:#dff0f8;color:#1a3a4a}
.dropdown-item.danger{color:#c04040}
.dropdown-item.danger:hover{background:#fde8e8}
.project-new{background:transparent;border:0.5px dashed #b0d4e3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;min-height:130px;color:#7aaab8;border-radius:10px;cursor:pointer;transition:border-color .15s,color .15s}
.project-new:hover{border-color:#2a7fa5;color:#2a7fa5;background:#f0faff}
.project-new i{font-size:26px}
.project-new span{font-size:13px}
.empty{text-align:center;padding:60px 20px;color:#9acad8;grid-column:1/-1}
.empty i{font-size:44px;margin-bottom:14px;display:block;color:#b0d4e3}
.empty p{font-size:14px;margin-bottom:20px}
.modal-overlay{position:fixed;inset:0;background:rgba(30,80,110,.2);display:flex;align-items:center;justify-content:center;z-index:200}
.modal{background:#f0faff;border:0.5px solid #b0d4e3;border-radius:12px;padding:24px;width:300px;box-shadow:0 12px 40px rgba(30,80,110,.12)}
.modal h3{font-size:15px;font-weight:500;margin-bottom:14px;color:#1a3a4a}
.modal p{font-size:12px;color:#5a8a9a;margin-bottom:14px;line-height:1.6}
.modal input{width:100%;font-size:13px;padding:9px 12px;border-radius:6px;border:0.5px solid #b0d4e3;background:#e8f4f8;color:#1a3a4a;font-family:'DM Sans',sans-serif;margin-bottom:14px;outline:none}
.modal input:focus{border-color:#2a7fa5}
.modal-btns{display:flex;gap:8px;justify-content:flex-end}
</style>
</head>
<body>
<div class="topbar">
  <div class="topbar-left">
    <a href="index.html" class="back-btn"><i class="ti ti-arrow-left"></i> Home</a>
    <div class="topbar-title">Prompt <span>Editor</span></div>
  </div>
  <button class="btn btn-primary" onclick="openNewModal()"><i class="ti ti-plus"></i> New project</button>
</div>
<div class="page">
  <div class="page-header">
    <div>
      <div class="page-title">Your projects</div>
      <div class="page-sub">Each project has its own prompt, versions and history</div>
    </div>
  </div>
  <div class="projects-grid" id="projects-grid"></div>
</div>

<div class="modal-overlay" id="project-modal" style="display:none" onclick="if(event.target===this)closeModal()">
  <div class="modal">
    <h3 id="modal-title">New project</h3>
    <input id="modal-input" placeholder="Project name" onkeydown="if(event.key==='Enter')saveModal()">
    <div class="modal-btns">
      <button class="btn" onclick="closeModal()">Cancel</button>
      <button class="btn btn-primary" onclick="saveModal()">Save</button>
    </div>
  </div>
</div>

<div class="modal-overlay" id="delete-modal" style="display:none" onclick="if(event.target===this)document.getElementById('delete-modal').style.display='none'">
  <div class="modal">
    <h3>Delete project?</h3>
    <p>This will permanently delete the project and all its versions. This cannot be undone.</p>
    <div class="modal-btns">
      <button class="btn" onclick="document.getElementById('delete-modal').style.display='none'">Cancel</button>
      <button class="btn" style="background:#c04040;color:#fff;border-color:#c04040" onclick="confirmDelete()">Delete</button>
    </div>
  </div>
</div>

<script>
if(sessionStorage.getItem('jt_unlocked')!=='1')window.location.href='index.html';

const PROJECTS_KEY='jt_projects';
let projects=[];
let modalMode=null;
let modalTargetId=null;
let deleteTargetId=null;
let activeDropdown=null;

function load(){try{const s=localStorage.getItem(PROJECTS_KEY);if(s)projects=JSON.parse(s);}catch(e){}}
function save(){try{localStorage.setItem(PROJECTS_KEY,JSON.stringify(projects));}catch(e){}}

function render(){
  const grid=document.getElementById('projects-grid');
  let html='';
  if(!projects.length){
    html=`<div class="empty"><i class="ti ti-file-text"></i><p>No projects yet</p><button class="btn btn-primary" onclick="openNewModal()"><i class="ti ti-plus"></i> New project</button></div>`;
  } else {
    [...projects].reverse().forEach(p=>{
      const date=new Date(p.updatedAt).toLocaleDateString([],{month:'short',day:'numeric',year:'numeric'});
      const draft=localStorage.getItem('jt_draft_'+p.id)||'';
      const words=draft.trim()?draft.trim().split(/\s+/).length:0;
      const vcount=JSON.parse(localStorage.getItem('jt_versions_'+p.id)||'[]').length;
      html+=`<div class="project-card" onclick="openProject('${p.id}')">
        <div class="card-icon"><i class="ti ti-file-text"></i></div>
        <div class="card-name">${esc(p.name)}</div>
        <div class="card-meta">Updated ${date}<br>${words} words &middot; ${vcount} version${vcount!==1?'s':''}</div>
        <div class="card-menu">
          <button class="card-menu-btn" onclick="toggleDd(event,'${p.id}')"><i class="ti ti-dots-vertical"></i></button>
          <div class="dropdown" id="dd-${p.id}" style="display:none">
            <div class="dropdown-item" onclick="openRename(event,'${p.id}')"><i class="ti ti-pencil"></i> Rename</div>
            <div class="dropdown-item danger" onclick="openDelete(event,'${p.id}')"><i class="ti ti-trash"></i> Delete</div>
          </div>
        </div>
      </div>`;
    });
  }
  grid.innerHTML=html;
}

function openProject(id){
  const p=projects.find(x=>x.id===id);
  if(p){p.updatedAt=Date.now();save();}
  window.location.href='editor.html?project='+id;
}

function toggleDd(e,id){
  e.stopPropagation();
  const dd=document.getElementById('dd-'+id);
  if(activeDropdown&&activeDropdown!==dd)activeDropdown.style.display='none';
  dd.style.display=dd.style.display==='none'?'block':'none';
  activeDropdown=dd.style.display==='block'?dd:null;
}
document.addEventListener('click',()=>{if(activeDropdown){activeDropdown.style.display='none';activeDropdown=null;}});

function openNewModal(){
  modalMode='new';modalTargetId=null;
  document.getElementById('modal-title').textContent='New project';
  document.getElementById('modal-input').value='';
  document.getElementById('project-modal').style.display='flex';
  setTimeout(()=>document.getElementById('modal-input').focus(),50);
}

function openRename(e,id){
  e.stopPropagation();if(activeDropdown){activeDropdown.style.display='none';activeDropdown=null;}
  const p=projects.find(x=>x.id===id);if(!p)return;
  modalMode='rename';modalTargetId=id;
  document.getElementById('modal-title').textContent='Rename project';
  document.getElementById('modal-input').value=p.name;
  document.getElementById('project-modal').style.display='flex';
  setTimeout(()=>{const i=document.getElementById('modal-input');i.focus();i.select();},50);
}

function closeModal(){document.getElementById('project-modal').style.display='none';}

function saveModal(){
  const name=document.getElementById('modal-input').value.trim();if(!name)return;
  if(modalMode==='new'){
    const id='p_'+Date.now();
    projects.push({id,name,createdAt:Date.now(),updatedAt:Date.now()});
    save();closeModal();window.location.href='editor.html?project='+id;
  } else {
    const p=projects.find(x=>x.id===modalTargetId);
    if(p){p.name=name;p.updatedAt=Date.now();save();}
    closeModal();render();
  }
}

function openDelete(e,id){
  e.stopPropagation();if(activeDropdown){activeDropdown.style.display='none';activeDropdown=null;}
  deleteTargetId=id;document.getElementById('delete-modal').style.display='flex';
}

function confirmDelete(){
  projects=projects.filter(x=>x.id!==deleteTargetId);
  localStorage.removeItem('jt_draft_'+deleteTargetId);
  localStorage.removeItem('jt_versions_'+deleteTargetId);
  save();document.getElementById('delete-modal').style.display='none';render();
}

function esc(t){return String(t).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

load();render();
</script>
</body>
</html>

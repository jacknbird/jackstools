<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jacks Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#e8f4f8;color:#1a3a4a;font-family:'DM Sans',sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;min-height:100vh;padding:24px;text-align:center}
.lock{position:fixed;inset:0;background:#e8f4f8;display:flex;flex-direction:column;align-items:center;justify-content:center;z-index:999;padding:24px}
.lock h2{font-family:'DM Serif Display',serif;font-size:32px;font-weight:400;margin-bottom:8px}
.lock p{font-size:13px;color:#5a9ab5;margin-bottom:24px}
.lock input{font-size:18px;padding:12px 16px;border-radius:8px;border:0.5px solid #b0d4e3;background:#f0faff;color:#1a3a4a;text-align:center;letter-spacing:.2em;width:180px;font-family:'DM Sans',sans-serif;outline:none}
.lock input:focus{border-color:#2a7fa5}
.lock input.wrong{border-color:#e07070;animation:shake .3s}
.lock-hint{font-size:11px;color:#e07070;margin-top:10px;height:16px}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
#main-content{display:none;flex-direction:column;align-items:center}
.badge{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:#5a9ab5;border:0.5px solid #b0d4e3;border-radius:20px;padding:5px 14px;margin-bottom:32px;display:inline-block;background:#f0faff}
h1{font-family:'DM Serif Display',serif;font-size:clamp(48px,10vw,88px);font-weight:400;line-height:1.05;margin-bottom:14px;letter-spacing:-.02em}
h1 span{color:#2a7fa5}
.sub{font-size:15px;color:#5a8a9a;margin-bottom:48px}
.tools{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px}
.tool-btn{display:flex;align-items:center;justify-content:space-between;background:#f0faff;border:0.5px solid #b0d4e3;border-radius:10px;padding:18px 20px;text-decoration:none;color:#1a3a4a;transition:border-color .15s,background .15s}
.tool-btn:hover{background:#dff0f8;border-color:#7abcd4}
.tool-left{display:flex;align-items:center;gap:14px}
.tool-icon{width:36px;height:36px;border-radius:8px;background:#dff0f8;border:0.5px solid #b0d4e3;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}
.tool-info{display:flex;flex-direction:column;align-items:flex-start;gap:2px}
.tool-name{font-size:14px;font-weight:500}
.tool-desc{font-size:11px;color:#5a9ab5}
.arrow{color:#2a7fa5;font-size:16px}
.footer{position:fixed;bottom:20px;font-size:11px;color:#9acad8}
</style>
</head>
<body>
<div class="lock" id="lock">
  <h2>Jack's Tools</h2>
  <p>Enter password to continue</p>
  <input type="password" id="pw-input" placeholder="••••" maxlength="20" onkeydown="if(event.key==='Enter')checkPw()">
  <div class="lock-hint" id="pw-hint"></div>
</div>
<div id="main-content">
  <span class="badge">jacktools.online</span>
  <h1>Jack's<br><span>Tools.</span></h1>
  <p class="sub">Your personal collection of tools.</p>
  <div class="tools">
    <a href="prompts.html" class="tool-btn">
      <div class="tool-left">
        <div class="tool-icon">✏️</div>
        <div class="tool-info">
          <span class="tool-name">Prompt Editor</span>
          <span class="tool-desc">Edit, version & diff AI prompts</span>
        </div>
      </div>
      <span class="arrow">→</span>
    </a>
    <a href="tickets.html" class="tool-btn">
      <div class="tool-left">
        <div class="tool-icon">🎟️</div>
        <div class="tool-info">
          <span class="tool-name">Ticket Finder</span>
          <span class="tool-desc">Find concert tickets &amp; last-minute deals</span>
        </div>
      </div>
      <span class="arrow">→</span>
    </a>
  </div>
</div>
<div class="footer" id="footer" style="display:none">More tools coming soon</div>
<script>
const PASSWORD='1971';
const SESSION_KEY='jt_unlocked';
function checkPw(){
  const val=document.getElementById('pw-input').value;
  if(val===PASSWORD){sessionStorage.setItem(SESSION_KEY,'1');unlock();}
  else{
    const i=document.getElementById('pw-input');i.classList.add('wrong');
    document.getElementById('pw-hint').textContent='Incorrect password';i.value='';
    setTimeout(()=>{i.classList.remove('wrong');document.getElementById('pw-hint').textContent='';},1500);
  }
}
function unlock(){
  document.getElementById('lock').style.display='none';
  document.getElementById('main-content').style.display='flex';
  document.getElementById('footer').style.display='';
}
if(sessionStorage.getItem(SESSION_KEY)==='1')unlock();
else setTimeout(()=>document.getElementById('pw-input').focus(),100);
</script>
</body>
</html>
